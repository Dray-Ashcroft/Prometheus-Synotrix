name: Mirror to Codeberg

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Clone GitHub repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"

          git -c http.extraheader="$AUTH_HEADER" clone --mirror \
            "https://github.com/${GITHUB_REPOSITORY}.git" mirror.git

      - name: Push to Codeberg
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          AUTH_HEADER="AUTHORIZATION: basic $(printf '%s' "Dray-Ashcroft:${CODEBERG_TOKEN}" | base64 -w0)"

          git -C mirror.git -c http.extraheader="$AUTH_HEADER" push --mirror \
            "https://codeberg.org/Dray-Ashcroft/Prometheus-Synotrix.git"
