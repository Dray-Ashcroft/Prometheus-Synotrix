name: Mirror to Codeberg

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Clone GitHub repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"

          git -c http.extraheader="$AUTH_HEADER" clone --mirror \
            "https://github.com/${GITHUB_REPOSITORY}.git" mirror.git

      - name: Push to Codeberg
        env:
          CODEBERG_USERNAME: Dray-Ashcroft
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          cat > "$RUNNER_TEMP/codeberg-askpass.sh" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' "$CODEBERG_USERNAME" ;;
            *Password*) printf '%s\n' "$CODEBERG_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF

          chmod +x "$RUNNER_TEMP/codeberg-askpass.sh"

          GIT_ASKPASS="$RUNNER_TEMP/codeberg-askpass.sh" \
          GIT_TERMINAL_PROMPT=0 \
          git -C mirror.git push --mirror \
            "https://codeberg.org/Dray-Ashcroft/Prometheus-Synotrix.git"
